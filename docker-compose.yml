services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./sites:/srv
    env_file:
      - .env

volumes:
  caddy_data:
  caddy_config: